name: artifacts

on:
    workflow_dispatch:  

jobs:
    artifact-producer:
        name: artifactProducer
        runs-on: ubuntu-24.04
        steps:
            - name: createArtifactFile
              run: |
                echo "This is generated by aritfactProdcer step1 createArtifactFile" > artifact.txt
                echo "Generated by artifactProducer step1 createArtifactFile" >> artifact.txt
            - name: uploadArtifact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                name: example-artifact
                path: artifact.txt
    artifact-consumer:
        name: artifactConsumer
        runs-on: ubuntu-24.04
        needs: artifact-producer
        steps:
            - name: downloadArtifact
              uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
              with:
                name: example-artifact
            - name: Cat artifact file
              run: cat artifact.txt






