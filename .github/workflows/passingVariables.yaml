name: PassingVariablesBetweenJobs

on:
    workflow_dispatch: 

jobs:
    producer:
        runs-on: ubuntu-22.04
        outputs:
            foo: ${{ steps.generate-foo.outputs.foo }}
        steps:
           - name: Generate foo 
             id: generate-foo
             run: |
                foo=bar
                echo "foo=${foo}" >> "$GITHUB_OUTPUT"
                echo "FOO={foo}" >> "$GITHUB_ENV"
           - name: Inspect Values
             run:
                echo "foo=${foo}" >> "$GITHUB_OUTPUT"
                echo "FOO={foo}" >> "$GITHUB_ENV"
    consumer:
        runs-on: uubuntu-22.04
        needs: producer
        steps:
          - name: Inspect Values in consumer
            run: |
                echo: "Value from consumer:  ${{ needs.producer.outputs.foo }}"
                echo: "FOO in consumer: ${FOO:-<UUNSET>}"

