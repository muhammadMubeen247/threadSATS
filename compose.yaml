services:


  nginx:
    image: nginx:alpine
    container_name: nginx_server
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - personas-network
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    networks:
      - personas-network
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - personas-network

networks:
  personas-network: