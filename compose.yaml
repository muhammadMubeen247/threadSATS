services:


  nginx:
    image: nginx:alpine
    container_name: nginx_server
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
      - frontend
    networks:
      - personas-network
  backend1:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:  
      - BACKEND=backend1
    networks:
      - personas-network
  backend2:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - BACKEND=backend2
    networks:
      - personas-network
  backend3:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - BACKEND=backend3
    networks:
      - personas-network
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - personas-network

networks:
  personas-network: